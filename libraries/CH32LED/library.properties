sentence=Peripheral driven FastLED compatible library for CH32 MCUs 
paragraph=This library provides a FastLED compatible interface for controlling WS2812B and similar addressable LEDs using the CH32 MCU's hardware peripherals. The library is designed to be easy to use and integrate into existing projects, allowing developers to port existing FastLED code to CH32 MCUs with minimal changes.
